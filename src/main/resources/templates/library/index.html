<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca — SteamUNLA</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:         #0e1117;
            --surface:    #161b26;
            --surface2:   #1e2536;
            --border:     #2a3347;
            --accent:     #4d9fff;
            --accent-dim: #1a3a5c;
            --green:      #4ade80;
            --green-dim:  #14532d;
            --text:       #e2e8f0;
            --muted:      #64748b;
            --danger:     #f87171;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }

        /* NAV */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        /* HEADER */
        .page-header {
            padding: 2.5rem 2rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .page-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .page-header h1 span {
            color: var(--accent);
        }

        .library-stats {
            display: flex;
            gap: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .library-stats strong {
            display: block;
            font-size: 1.4rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--text);
        }

        /* FILTERS */
        .filters {
            padding: 1rem 2rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .search-input {
            margin-left: auto;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            width: 220px;
            outline: none;
        }

        /* MAIN */
        .main {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: calc(100vh - 56px - 80px);
        }

        /* SIDEBAR */
        .sidebar {
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
        }

        .game-list-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
        }

        .game-list-item:hover {
            background: var(--surface2);
        }

        .game-list-item.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .game-thumb {
            width: 36px;
            height: 36px;
            border-radius: 3px;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-list-name {
            font-size: 0.82rem;
            font-weight: 500;
        }

        .installed-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-left: auto;
        }

        /* CONTENT */
        .content {
            padding: 2rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            transition: 0.2s;
        }

        .game-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-image {
            width: 100%;
            height: 140px;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .installed-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: var(--green);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-dev {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .card-meta {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .tag {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn-outline:hover {
            border-color: var(--text);
            color: var(--text);
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav>
    <a href="/" class="nav-logo">STEAMUNLA</a>

    <div class="nav-links">
        <a href="/games">Tienda</a>
        <a href="/games/new">Publicar juego</a>
        <a href="/library" class="active">Biblioteca</a>
        <a href="/wishlist">Lista de deseados</a>
        <a href="/promotions">Promociones</a>
        <!--<a href="/benefits">Beneficios</a>-->
    </div>

    <div class="nav-links">
        <a href="#" th:text="'Hola, ' + ${user.username}">Hola usuario</a>
        <a href="/logout">Salir</a>
    </div>
</nav>

<!-- HEADER -->
<div class="page-header">
    <h1>Mi <span>Biblioteca</span></h1>

    <div class="library-stats">
        <div>
            <strong th:text="${library.size()}">0</strong>
            juegos
        </div>

        <div>
            <strong th:text="${installedCount}">0</strong>
            instalados
        </div>
    </div>
</div>

<!-- FILTERS -->
<div class="filters">
    <button class="filter-btn active">Todos</button>
    <button class="filter-btn">Instalados</button>
    <button class="filter-btn">No instalados</button>

    <input type="text" class="search-input" placeholder="Buscar en biblioteca...">
</div>

<!-- MAIN -->
<div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-title">Juegos</div>

        <div th:if="${library.empty}"
             style="color: var(--muted); font-size: 0.8rem; padding: 0.5rem;">
            Tu biblioteca está vacía
        </div>

        <div th:each="entry, iterStat : ${library}"
             class="game-list-item"
             th:classappend="${iterStat.index == 0} ? 'selected' : ''">

            <div class="game-thumb">
                <img th:if="${entry.game.imageUrl != null}"
                     th:src="${entry.game.imageUrl}">
                <span th:unless="${entry.game.imageUrl != null}">🎮</span>
            </div>

            <span class="game-list-name"
                  th:text="${entry.game.title}">
                Juego
            </span>

            <div class="installed-dot"
                 th:if="${entry.installed}">
            </div>

        </div>

    </aside>

    <!-- CONTENT -->
    <main class="content">

        <div class="games-grid">

            <div class="game-card"
                 th:each="entry : ${library}">

                <!-- IMAGE -->
                <div class="card-image">

                    <img th:if="${entry.game.imageUrl != null}"
                         th:src="${entry.game.imageUrl}">

                    <span th:unless="${entry.game.imageUrl != null}">
                        🎮
                    </span>

                    <span class="installed-badge"
                          th:if="${entry.installed}">
                        Instalado
                    </span>

                </div>

                <!-- BODY -->
                <div class="card-body">

                    <div class="card-title"
                         th:text="${entry.game.title}">
                        Juego
                    </div>

                    <div class="card-dev"
                         th:text="${entry.game.developerName}">
                        Dev
                    </div>

                    <div class="card-meta">

                        <span class="tag"
                              th:text="${entry.game.genre}">
                            Género
                        </span>

                    </div>

                    <!-- ACTIONS -->
                    <div class="card-actions">

                        <!-- NO INSTALADO -->
                        <div th:unless="${entry.installed}"
                             style="display:flex; gap:0.5rem; flex:1;">

                            <a th:href="@{/library/install/{id}(id=${entry.game.id})}"
                               th:data-download-url="@{/library/download/{id}(id=${entry.game.id})}"
                               class="btn btn-primary"
                               onclick="downloadAndInstall(event, this)">
                                ⬇ Instalar
                            </a>

                        </div>

                        <!-- INSTALADO -->
                        <div th:if="${entry.installed}"
                             style="display:flex; gap:0.5rem; flex:1;">

                            <button class="btn btn-success">
                                ▶ Jugar
                            </button>

                            <a th:href="@{/library/uninstall/{id}(id=${entry.game.id})}"
                               class="btn btn-outline"
                               style="color: var(--danger); border-color: var(--danger);">
                                ✕ Desinstalar
                            </a>

                        </div>

                        <!-- DETALLE -->
                        <a th:href="@{/games/{id}(id=${entry.game.id})}"
                           class="btn btn-outline">
                            Ver detalle
                        </a>

                        <!-- PATCHES -->
                        <a th:href="@{/updates/{id}(id=${entry.game.id})}"
                           class="btn btn-outline">
                            🛠 Parches
                        </a>

                        <!-- PROMOTIONS -->
                        <a th:href="@{/promotions/game/{id}(id=${entry.game.id})}"
                           class="btn btn-outline">
                            💸 Promos
                        </a>

                        <!-- BENEFITS -->
                        <a th:href="@{/benefits/game/{id}(id=${entry.game.id})}"
                            class="btn btn-outline">
                            🎁 Beneficios
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script>

    function downloadAndInstall(event, element) {

        event.preventDefault();

        const installUrl = element.getAttribute('href');
        const downloadUrl = element.getAttribute('data-download-url');

        const link = document.createElement('a');

        link.href = downloadUrl;

        link.click();

        setTimeout(() => {
            window.location.href = installUrl;
        }, 500);
    }

</script>

</body>
</html>
