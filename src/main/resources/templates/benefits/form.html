<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Beneficio — SteamUNLA</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0e1117;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        nav {
            background: #161b26;
            padding: 12px 24px;
            border-bottom: 1px solid #2a3347;
        }

        .wrap {
            max-width: 700px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            color: #4d9fff;
        }

        .card {
            background: #161b26;
            border: 1px solid #2a3347;
            border-radius: 12px;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            color: #94a3b8;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #2a3347;
            background: #0e1117;
            color: #e2e8f0;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: #4d9fff;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #2f7fe0;
        }

        .back {
            display: inline-block;
            margin-bottom: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        .back:hover {
            color: #4d9fff;
        }
    </style>
</head>

<body>

<nav>
    <a href="/" style="color:#4d9fff;font-weight:700;text-decoration:none;">
        STEAMUNLA
    </a>
</nav>

<div class="wrap">

    <a class="back"
       th:href="@{/benefits/game/{gameId}(gameId=${gameId})}">
        ← Volver
    </a>

    <h1 th:text="${benefit.id != null} ? 'Editar beneficio' : 'Nuevo beneficio'">
        Beneficio
    </h1>

    <div class="card">

        <!-- CREATE -->
        <form th:if="${benefit.id == null}"
              th:action="@{/benefits/save/{gameId}(gameId=${gameId})}"
              method="post">

            <label>Título</label>
            <input type="text" name="title" required>

            <label>Descripción</label>
            <textarea name="description" required></textarea>

            <button class="btn" type="submit">
                Guardar
            </button>

        </form>

        <!-- EDIT -->
        <form th:if="${benefit.id != null}"
              th:action="@{/benefits/update/{id}(id=${benefit.id})}"
              method="post">

            <label>Título</label>
            <input type="text"
                   name="title"
                   th:value="${benefit.title}"
                   required>

            <label>Descripción</label>
            <textarea name="description"
                      th:text="${benefit.description}"
                      required></textarea>

            <button class="btn" type="submit">
                Actualizar
            </button>

        </form>

    </div>

</div>

</body>
</html>
