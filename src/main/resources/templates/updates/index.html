<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizaciones — SteamUNLA</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0e1117;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        nav {
            background: #161b26;
            padding: 12px 24px;
            border-bottom: 1px solid #2a3347;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #2a3347;
            color: #cbd5e1;
        }

        .btn:hover {
            border-color: #4d9fff;
            color: #4d9fff;
        }

        .btn-danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-danger:hover {
            background: #ef4444;
            color: white;
        }

        .wrap {
            max-width: 1000px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            color: #4d9fff;
        }

        .game-title {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .card {
            background: #161b26;
            border: 1px solid #2a3347;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .version {
            color: #4d9fff;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date {
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
        }

        .notes {
            margin-top: 8px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .empty {
            color: #64748b;
            padding: 40px;
            border: 1px dashed #2a3347;
            text-align: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<nav>
    <a href="/" style="color:#4d9fff;font-weight:700;text-decoration:none;">
        STEAMUNLA
    </a>

    <!-- BOTÓN NUEVO PARCHE (CORRECTO) -->
    <a th:href="@{/updates/new/{gameId}(gameId=${game.id})}" class="btn">
        ➕ Nuevo parche
    </a>
</nav>

<div class="wrap">

    <h1>Actualizaciones</h1>

    <div class="game-title">
        Juego: <span th:text="${game.title}">Nombre juego</span>
    </div>

    <!-- EMPTY -->
    <div th:if="${#lists.isEmpty(updates)}" class="empty">
        Este juego todavía no tiene parches publicados.
    </div>

    <!-- LIST -->
    <div th:each="u : ${updates}" class="card">

        <div class="version">

            <span>
                Versión <span th:text="${u.version}">1.0.0</span>
            </span>

            <div class="top-actions">

                <!-- EDIT -->
                <a th:href="@{/updates/edit/{id}(id=${u.id})}" class="btn">
                    ✏ Editar
                </a>

                <!-- DELETE -->
                <a th:href="@{/updates/delete/{id}(id=${u.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('¿Eliminar este parche?')">
                    🗑 Eliminar
                </a>

            </div>

        </div>

        <div class="date"
             th:text="${#temporals.format(u.releaseDate, 'dd/MM/yyyy HH:mm')}">
            Fecha
        </div>

        <div class="notes"
             th:text="${u.patchNotes}">
            Notas del parche
        </div>

    </div>

</div>

</body>
</html>
