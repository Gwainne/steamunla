<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Promociones — SteamUNLA</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0e1117;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        nav {
            background: #161b26;
            padding: 12px 24px;
            border-bottom: 1px solid #2a3347;
        }

        .wrap {
            max-width: 1000px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            color: #4d9fff;
        }

        .game-title {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .card {
            background: #161b26;
            border: 1px solid #2a3347;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .discount {
            color: #4d9fff;
            font-weight: 700;
        }

        .desc {
            margin-top: 8px;
            color: #cbd5e1;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #2a3347;
            color: #cbd5e1;
            background: transparent;
        }

        .btn:hover {
            border-color: #4d9fff;
            color: #4d9fff;
        }

        .btn-danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-danger:hover {
            background: #ef4444;
            color: white;
        }

        .empty {
            color: #64748b;
            padding: 40px;
            border: 1px dashed #2a3347;
            text-align: center;
            border-radius: 12px;
        }

        .back {
            display: inline-block;
            margin-bottom: 16px;
            color: #94a3b8;
            text-decoration: none;
        }

        .back:hover {
            color: #4d9fff;
        }
    </style>
</head>

<body>

<nav>
    <a href="/" style="color:#4d9fff;font-weight:700;text-decoration:none;">
        STEAMUNLA
    </a>
</nav>

<div class="wrap">

    <!-- BACK -->
    <a class="back" th:href="@{/library}">
        ← Volver a la biblioteca
    </a>

    <h1>Promociones</h1>

    <div class="game-title" th:text="${game.title}">
        Juego
    </div>

    <a class="btn" th:href="@{/promotions/new/{gameId}(gameId=${game.id})}">
        ➕ Nueva promoción
    </a>

    <br><br>

    <div th:if="${#lists.isEmpty(promotions)}" class="empty">
        Este juego no tiene promociones activas.
    </div>

    <div th:each="p : ${promotions}" class="card">

        <div class="top">
            <span class="discount" th:text="${p.discountPercent + '% OFF'}">
                20% OFF
            </span>

            <div>
                <a th:href="@{/promotions/edit/{id}(id=${p.id})}" class="btn">✏ Editar</a>
                <a th:href="@{/promotions/delete/{id}(id=${p.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('¿Eliminar promoción?')">
                    🗑
                </a>
            </div>
        </div>

        <div class="desc" th:text="${p.description}">
            Descripción
        </div>

    </div>

</div>

</body>
</html>
