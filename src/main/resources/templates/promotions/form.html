<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Promoción — SteamUNLA</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0e1117;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .wrap {
            max-width: 700px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            color: #4d9fff;
        }

        .card {
            background: #161b26;
            border: 1px solid #2a3347;
            border-radius: 12px;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            color: #94a3b8;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #2a3347;
            background: #0e1117;
            color: #e2e8f0;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        .btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: #4d9fff;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #2f7fe0;
        }

        .back {
            display: inline-block;
            margin-bottom: 16px;
            color: #94a3b8;
            text-decoration: none;
        }

        .back:hover {
            color: #4d9fff;
        }
    </style>
</head>

<body>

<div class="wrap">

    <!-- BACK -->
    <a class="back" th:href="@{/promotions/game/{gameId}(gameId=${game.id})}">
        ← Volver a promociones
    </a>

    <h1 th:text="${promotion.id != null} ? 'Editar promoción' : 'Nueva promoción'">
        Promoción
    </h1>

    <div class="card">

        <form th:if="${promotion.id == null}"
              th:action="@{/promotions/save/{gameId}(gameId=${game.id})}"
              method="post">

            <label>Descuento (%)</label>
            <input type="number" name="discountPercent" required>

            <label>Descripción</label>
            <textarea name="description" required></textarea>

            <button class="btn" type="submit">Guardar</button>
        </form>

        <form th:if="${promotion.id != null}"
              th:action="@{/promotions/update/{id}(id=${promotion.id})}"
              method="post">

            <label>Descuento (%)</label>
            <input type="number"
                   name="discountPercent"
                   th:value="${promotion.discountPercent}"
                   required>

            <label>Descripción</label>
            <textarea name="description"
                      th:text="${promotion.description}"
                      required></textarea>

            <button class="btn" type="submit">Actualizar</button>
        </form>

    </div>

</div>

</body>
</html>
