<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva promoción — SteamUNLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0e1117;
            --surface: #161b26;
            --surface2: #1e2536;
            --border: #2a3347;
            --accent: #4d9fff;
            --green: #4ade80;
            --text: #e2e8f0;
            --muted: #64748b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }
        .wrap { max-width: 600px; margin: 0 auto; padding: 28px 24px 40px; }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }
        .title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .actions { display: flex; gap: 12px; flex-direction: column; margin-top: 24px; }
        .btn {
            border-radius: 10px; padding: 12px 16px; text-decoration: none; border: 1px solid #2a3347;
            color: #e2e8f0; background: #161b26; cursor: pointer; font-size: 1rem; font-weight: 500;
            text-align: center; display: block;
        }
        .btn.primary { background: linear-gradient(135deg, #4d9fff, #2d6cdf); border-color: transparent; }
        .btn.primary:hover { background: linear-gradient(135deg, #6baaff, #3d7cef); }
        .back-link {
            display: inline-block;
            color: var(--accent);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<nav>
    <a href="/" class="nav-logo">STEAMUNLA</a>
    <div class="nav-links">
        <a href="/games">Tienda</a>
        <a href="/games/new" th:if="${user != null and user.role == 'DEVELOPER'}">Publicar juego</a>
        <a href="/library">Biblioteca</a>
        <a href="/wishlist">Lista de deseados</a>
    </div>
    <div class="nav-links" th:if="${user != null}">
        <a href="/profile" th:text="${user.username}">usuario</a>
        <a href="/logout">Salir</a>
    </div>
    <div class="nav-links" th:if="${user == null}">
        <a href="/login">Ingresar</a>
        <a href="/register">Registrarse</a>
    </div>
</nav>

<div class="wrap">
    <a href="/games/my-games" class="back-link">← Volver a mis juegos</a>

    <div class="container">
        <h1 class="title" th:text="'Nueva promoción para ' + ${game.title}">Nueva promoción</h1>
        <p class="subtitle">Configurá un descuento temporal para tu juego.</p>

        <form th:action="@{/promotions/create}" method="post">
            <input type="hidden" name="gameId" th:value="${game.id}">

            <div class="form-group">
                <label for="discountPercent">Descuento (%)</label>
                <input type="number" id="discountPercent" name="discountPercent" min="1" max="100" required placeholder="Ej: 20">
            </div>

            <div class="form-group">
                <label for="startDate">Fecha de inicio</label>
                <input type="date" id="startDate" name="startDate" required>
            </div>

            <div class="form-group">
                <label for="endDate">Fecha de fin</label>
                <input type="date" id="endDate" name="endDate" required>
            </div>

            <div class="form-group">
                <label for="description">Descripción (opcional)</label>
                <input type="text" id="description" name="description" placeholder="Ej: 20% de descuento por tiempo limitado">
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">Crear promoción</button>
                <a href="/games/my-games" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
