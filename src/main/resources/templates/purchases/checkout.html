<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — SteamUNLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0e1117;
            --surface: #161b26;
            --surface2: #1e2536;
            --border: #2a3347;
            --accent: #4d9fff;
            --green: #4ade80;
            --text: #e2e8f0;
            --muted: #64748b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
        }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--text); }
        .wrap { max-width: 600px; margin: 0 auto; padding: 40px 24px; }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }
        .header { margin-bottom: 32px; }
        .title { font-family: 'Rajdhani', sans-serif; font-size: 2rem; margin-bottom: 8px; }
        .subtitle { color: var(--muted); font-size: 0.9rem; }
        .game-info {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .game-name { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; margin-bottom: 8px; }
        .game-price { color: var(--green); font-size: 1.2rem; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent); }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn.primary {
            background: linear-gradient(135deg, #4d9fff, #2d6cdf);
            color: white;
        }
        .btn.primary:hover {
            background: linear-gradient(135deg, #6baaff, #3d7cef);
        }
        .btn.secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 12px;
        }
        .btn.secondary:hover {
            background: var(--border);
        }
        .back-link {
            display: inline-block;
            color: var(--accent);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
        .notice {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: #bbf7d0;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<nav>
    <a href="/" class="nav-logo">STEAMUNLA</a>
    <div class="nav-links">
        <a href="/games">Tienda</a>
        <a href="/library">Biblioteca</a>
    </div>
    <div class="nav-links" th:if="${user != null}">
        <a href="#" th:text="'Hola, ' + ${user.username}">Hola, usuario</a>
        <a href="/logout">Salir</a>
    </div>
    <div class="nav-links" th:if="${user == null}">
        <a href="/login">Ingresar</a>
        <a href="/register">Registrarse</a>
    </div>
</nav>

<div class="wrap">
    <a href="/games" class="back-link">← Volver a la tienda</a>

    <div class="container">
        <div class="header">
            <h1 class="title">Finalizar compra</h1>
            <p class="subtitle">Completa los detalles de tu compra</p>
        </div>

        <div class="notice">
            ✓ Compra segura. Tu información está protegida.
        </div>

        <div class="game-info">
            <div class="game-name" th:text="${game.title}">Nombre del juego</div>
            <div class="game-price" th:text="${'$' + #numbers.formatDecimal(game.price != null ? game.price : 0, 1, 2)}">
                $9.99
            </div>
        </div>

        <form th:action="@{/purchases/confirm}" method="post">
            <input type="hidden" name="gameId" th:value="${game.id}">

            <div class="form-group">
                <label for="paymentMethod">Método de pago:</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="">Selecciona un método</option>
                    <option value="CREDIT_CARD">Tarjeta de crédito</option>
                    <option value="DEBIT_CARD">Tarjeta de débito</option>
                    <option value="PAYPAL">PayPal</option>
                </select>
            </div>

            <div style="display:flex; flex-direction:column; gap:12px; margin-top:8px;">
                <button type="submit" class="btn primary">
                    Confirmar compra
                </button>
            </div>
        </form>

        <a href="/games" class="btn secondary" style="display:block; text-align:center; margin-top:12px; padding:12px 16px; border-radius:10px; border:1px solid #2a3347; background:#1e2536; color:#e2e8f0; font-weight:600; font-size:1rem;">
            Cancelar
        </a>
    </div>
</div>
</body>
</html>
