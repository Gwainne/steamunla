<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra realizada — SteamUNLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0e1117;
            --surface: #161b26;
            --surface2: #1e2536;
            --border: #2a3347;
            --accent: #4d9fff;
            --green: #4ade80;
            --text: #e2e8f0;
            --muted: #64748b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
        }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--text); }
        .wrap { max-width: 600px; margin: 0 auto; padding: 60px 24px; }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .title { font-family: 'Rajdhani', sans-serif; font-size: 2rem; margin-bottom: 8px; }
        .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
        .details {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label { color: var(--muted); }
        .detail-value { font-weight: 600; color: var(--green); }
        .buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
        }
        .btn.primary {
            background: linear-gradient(135deg, #4d9fff, #2d6cdf);
            color: white;
        }
        .btn.primary:hover {
            background: linear-gradient(135deg, #6baaff, #3d7cef);
        }
        .btn.secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn.secondary:hover {
            background: var(--border);
        }
        .success-notice {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: #bbf7d0;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<nav>
    <a href="/" class="nav-logo">STEAMUNLA</a>
    <div class="nav-links">
        <a href="/games">Tienda</a>
        <a href="/library">Biblioteca</a>
    </div>
    <div class="nav-links" th:if="${user != null}">
        <a href="#" th:text="'Hola, ' + ${user.username}">Hola, usuario</a>
        <a href="/logout">Salir</a>
    </div>
    <div class="nav-links" th:if="${user == null}">
        <a href="/login">Ingresar</a>
        <a href="/register">Registrarse</a>
    </div>
</nav>

<div class="wrap">
    <div class="container">
        <div class="icon">✅</div>
        <h1 class="title">¡Compra realizada!</h1>
        <p class="subtitle">Tu juego ha sido agregado a tu biblioteca</p>

        <div class="success-notice">
            🎮 Puedes comenzar a jugar desde tu biblioteca en cualquier momento.
        </div>

        <div class="details" th:if="${game != null}">
            <div class="detail-row">
                <span class="detail-label">Juego</span>
                <span class="detail-value" th:text="${game.title}">Nombre del juego</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Precio</span>
                <span class="detail-value" th:text="${'$' + #numbers.formatDecimal(game.price != null ? game.price : 0, 1, 2)}">$9.99</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Método de pago</span>
                <span class="detail-value" th:text="${paymentMethod != null ? paymentMethod : 'No especificado'}">Tarjeta</span>
            </div>
        </div>

        <div class="buttons">
            <a href="/library" class="btn primary">
                Ir a mi biblioteca
            </a>
            <a href="/games" class="btn secondary">
                Seguir explorando
            </a>
        </div>
    </div>
</div>
</body>
</html>
